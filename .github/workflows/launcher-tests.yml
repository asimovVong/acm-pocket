name: Launcher tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual launchers, background servers and command installation
        run: python -X utf8 -m unittest discover -s tests -v
